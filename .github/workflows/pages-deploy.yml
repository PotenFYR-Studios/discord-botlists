# Deploys the docs website.
# Default domain: https://potenfyr-studios.github.io/discord-botlists/
# Custom domain : drop a website/CNAME file containing your domain (e.g. docs.potenfyr.in),
#                 set the domain in repo Settings > Pages, and the build switches to root-base
#                 automatically (vite.config.ts detects CNAME) and ships dist/CNAME.
name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .status/status.json
  workflow_dispatch:
  workflow_run:
    workflows: ["Status sync"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install and build
        working-directory: website
        run: |
          bun install --frozen-lockfile
          cp ../.status/status.json src/data/status.json 2>/dev/null || true
          bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
