name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Unit tests
        run: bun run test
      - name: Package size guard
        run: |
          bun pm pack --dry-run 2>&1 | tail -20
