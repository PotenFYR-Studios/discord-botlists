name: Publish npm

# Trusted publishing (OIDC): configure a trusted publisher on npmjs.com for
# this package pointing at .github/workflows/npm-publish.yml in this repo,
# then every published GitHub release publishes to npm with zero tokens.
# Docs: https://docs.npmjs.com/trusted-publishers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run publish in dry-run mode
        required: false
        default: 'true'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Verify pack contents
        run: npm pack --dry-run
      - name: Guard against secrets in the tarball
        run: |
          ! grep -rEq "(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{20,}|eyJ[a-zA-Z0-9._-]{30,})" dist/ || (echo "possible secret in dist" && exit 1)
      - name: Check version not already published
        if: github.event_name == 'release'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@potenfyrstudios/discord-botlists@$VERSION" version >/dev/null 2>&1; then
            echo "version $VERSION already published, skipping"
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi
      - name: Publish (trusted publishing, OIDC, provenance)
        if: env.SKIP != 'true' && github.event_name == 'release'
        run: |
          npm publish --provenance --access public || \
          npm publish --access public
      - name: Dry run (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true'
        run: npm publish --dry-run --provenance --access public
