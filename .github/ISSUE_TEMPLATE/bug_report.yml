name: Bug report
description: Report something broken in the SDK or the docs site
labels: [bug, help wanted]
assignees:
  - SidisLiveYT
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Search existing issues first.
        Security vulnerabilities should go through [private reporting](https://github.com/PotenFYR-Studios/discord-botlists/security/advisories/new) instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal code that triggers the issue, plus the steps to run it.
      placeholder: |
        ```ts
        const lists = new Botlists({ ... });
        ```
        Run with `bun scripts/test-live.ts` or your own script.
      render: markdown
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Stats posting (postStats / postStatsTo / postViaBotBlock)
        - Webhooks (VoteWebhookServer / ingestWebhook)
        - Parser (fetchBot / searchBots / UniversalBot)
        - Status checker
        - Docs site (botlists.docs.potenfyr.in)
        - Other
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: 1.0.1
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node.js
        - Bun
        - Deno (via npm compat)
        - Other
    validations:
      required: true
  - type: input
    id: runtime-version
    attributes:
      label: Runtime version
      placeholder: Node 22.4.0 / Bun 1.1.29
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or errors
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
