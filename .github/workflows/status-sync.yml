name: Status sync

# Probes every list hourly and refreshes the README status table and docs
# site status.json on the default branch. Dead lists are tracked in ONE
# GitHub issue - never a branch or PR: while a detected list is not yet
# marked in the generated registry, the issue gets (re)opened and updated;
# once every reported list is marked, the issue closes itself.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Probe all lists
        id: probe
        run: bun scripts/status-sync.ts
      - name: Commit status refresh (live data only)
        run: |
          git config user.name "potenfyr-bot"
          git config user.email "bot@potenfyr.in"
          git add .status/status.json .status/STATUS.md README.md docs/src/data/status.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore(status): refresh botlist status board"
          git push
      - name: Open or update the dead-list tracking issue
        if: steps.probe.outputs.pr_needed == 'true'
        env:
          # first-party value written by scripts/status-sync.ts: dead list ids
          # that are not yet marked in the generated registry
          DEAD: ${{ steps.probe.outputs.dead_lists }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Registry update needed: mark dead lists"
          BODY="Automated status sync detected these lists as deprecated or shutdown, and they are not yet marked in the generated registry: $DEAD

          To resolve, run 'bun scripts/mark-dead.ts $DEAD', commit and push the result to master. Marking them stops posting stats to them. Details in .status/STATUS.md."
          NUM=$(gh issue list --state open --search "$TITLE in:title" --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            CLOSED=$(gh issue list --state closed --search "$TITLE in:title" --limit 1 --json number --jq '.[0].number // empty')
            if [ -z "$CLOSED" ]; then
              gh issue create --title "$TITLE" --body "$BODY"
            else
              gh issue reopen "$CLOSED"
              gh issue comment "$CLOSED" --body "$BODY"
            fi
          else
            gh issue comment "$NUM" --body "$BODY"
          fi
      - name: Close the tracking issue once every dead list is marked
        if: steps.probe.outputs.pr_needed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Registry update needed: mark dead lists"
          NUM=$(gh issue list --state open --search "$TITLE in:title" --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "All reported dead lists are now marked in the generated registry. Auto-closing."
          fi
